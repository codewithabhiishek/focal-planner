<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Focal — What should I do next?</title>
    <meta
      name="description"
      content="Dump your tasks. Focal weighs them against your goals and deadlines and points at the one thing worth doing right now."
    />
    <meta name="theme-color" content="#F5F3EE" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      /* apply the saved appearance before first paint — no wrong-color flash */
      (function () {
        try {
          var raw = localStorage.getItem("focal.state.v1");
          var theme = raw ? (JSON.parse(raw).settings || {}).theme : null;
          if (theme === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
            document.documentElement.style.backgroundColor = "#17171a";
          }
        } catch (e) {
          /* fresh start */
        }
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background-color: #f5f3ee;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
